research:
  en:
    keywords: "Reinforcement Learning · Goal-Conditioned Learning · Intrinsic Motivation · World Models"
    text: >-
      My research lies at the intersection of reinforcement learning, goal-conditioned learning, intrinsic
      motivation, and world model learning. I am particularly interested in how autonomous agents can learn and
      adapt in complex, dynamic environments driven by internal goals and curiosity.
  zh:
    keywords: "强化学习 · 目标条件学习 · 内在动机 · 世界模型学习"
    text: >-
      研究聚焦于强化学习、目标条件学习（Goal-conditioned learning）、内在动机（Intrinsic motivation）与世界模型学习（World
      model learning）的交叉领域，重点关注自主智能体如何在复杂、动态的环境中，由内在目标与好奇心驱动，实现自主学习与持续适应。

